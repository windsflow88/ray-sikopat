<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

  <div class="w-full max-w-sm flex flex-col gap-6">
    <!-- Header Logo -->
    <div class="bg-blue-900 text-white rounded-2xl p-6 flex flex-col items-center justify-center shadow-md">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-2">
        <span class="text-blue-900 font-bold italic text-xl">Ray</span>
      </div>
      <h1 class="text-sm font-semibold">Sistem Absensi Karyawan</h1>
    </div>

    <!-- Form Login -->
    <div class="bg-white rounded-2xl shadow-md p-6">
      <form id="loginForm" class="flex flex-col gap-4">
        
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">Pilih Nama Anda</label>
          <select id="nama" class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900">
            <option value="Yasir Arafat">Yasir Arafat</option>
            <option value="Karyawan Lain">Karyawan Lain</option>
          </select>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">PIN (4 digit)</label>
          <input type="password" id="pin" maxlength="4" placeholder="****" required 
                 class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900 text-center tracking-widest">
        </div>

        <button type="submit" id="btnSubmit" class="bg-blue-900 text-white font-semibold py-2 rounded-lg text-sm mt-2 transition hover:bg-blue-800">
          Masuk
        </button>

      </form>
    </div>
  </div>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec"; 

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      const nama = document.getElementById("nama").value;
      const pin = document.getElementById("pin").value;

      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", nama: nama, pin: pin })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          // Simpan sesi login
          localStorage.setItem("session_absen", JSON.stringify({
            nama: data.nama,
            jabatan: data.jabatan
          }));
          // Pindah ke dashboard
          window.location.href = "dashboard.html"; 
        } else {
          alert("Login gagal: " + data.message);
          btn.innerText = "Masuk";
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("Terjadi kesalahan jaringan.");
        btn.innerText = "Masuk";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
