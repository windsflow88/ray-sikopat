<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

  <div class="w-full max-w-sm flex flex-col gap-6">
    <!-- Header Logo -->
    <div class="bg-blue-900 text-white rounded-2xl p-6 flex flex-col items-center justify-center shadow-md">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-2">
        <span class="text-blue-900 font-bold italic text-xl">Ray</span>
      </div>
      <h1 class="text-sm font-semibold">Sistem Absensi Karyawan</h1>
    </div>

    <!-- Form Login -->
    <div class="bg-white rounded-2xl shadow-md p-6">
      <form id="loginForm" class="flex flex-col gap-4">
        
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">Pilih Nama Anda</label>
          <!-- Dropdown ini sekarang kosong dan akan diisi otomatis oleh JavaScript -->
          <select id="nama" class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900">
            <option value="">Memuat daftar nama...</option>
          </select>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">PIN (4 digit)</label>
          <input type="password" id="pin" maxlength="4" placeholder="****" required 
                 class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900 text-center tracking-widest">
        </div>

        <button type="submit" id="btnSubmit" class="bg-blue-900 text-white font-semibold py-2 rounded-lg text-sm mt-2 transition hover:bg-blue-800 disabled:opacity-50">
          Masuk
        </button>

      </form>
    </div>
  </div>

  <script>
    // WAJIB GANTI URL DI BAWAH INI DENGAN URL WEB APP GAS MILIK ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec"; 

    // 1. FUNGSI UNTUK MENGAMBIL DAFTAR NAMA DARI SPREADSHEET (SAAT HALAMAN DIBUKA)
    window.addEventListener('DOMContentLoaded', () => {
      const selectNama = document.getElementById("nama");
      const btnSubmit = document.getElementById("btnSubmit");
      
      // Matikan tombol masuk sementara data nama belum selesai dimuat
      btnSubmit.disabled = true;

      fetch(GAS_URL) 
        .then(response => response.json())
        .then(res => {
          selectNama.innerHTML = ""; // Bersihkan teks "Memuat daftar nama..."
          
          if (res.status === "success" && res.data.length > 0) {
            res.data.forEach(namaKaryawan => {
              const option = document.createElement("option");
              option.value = namaKaryawan;
              option.textContent = namaKaryawan;
              selectNama.appendChild(option);
            });
            btnSubmit.disabled = false; // Aktifkan kembali tombol setelah nama berhasil dimuat
          } else {
            selectNama.innerHTML = '<option value="">Data karyawan kosong</option>';
          }
        })
        .catch(err => {
          selectNama.innerHTML = '<option value="">Gagal memuat data dari server</option>';
        });
    });

    // 2. FUNGSI UNTUK PROSES LOGIN (SAAT TOMBOL MASUK DITEKAN)
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      const nama = document.getElementById("nama").value;
      const pin = document.getElementById("pin").value;

      // Validasi tambahan jika nama belum terpilih
      if (!nama) {
        alert("Silakan pilih nama terlebih dahulu.");
        return;
      }

      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", nama: nama, pin: pin })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          // Simpan sesi login ke browser
          localStorage.setItem("session_absen", JSON.stringify({
            nama: data.nama,
            jabatan: data.jabatan
          }));
          // Pindah ke dashboard
          window.location.href = "dashboard.html"; 
        } else {
          alert("Login gagal: " + data.message);
          btn.innerText = "Masuk";
          btn.disabled = false;
        }
      })
      .catch(err => {
        alert("Terjadi kesalahan jaringan.");
        btn.innerText = "Masuk";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
