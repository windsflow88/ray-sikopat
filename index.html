<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

  <div class="w-full max-w-sm flex flex-col gap-6">
    <!-- Header Logo -->
    <div class="bg-blue-900 text-white rounded-2xl p-6 flex flex-col items-center justify-center shadow-md">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-2">
        <span class="text-blue-900 font-bold italic text-xl">Ray</span>
      </div>
      <h1 class="text-sm font-semibold">Sistem Absensi Karyawan</h1>
    </div>

    <!-- Form Login -->
    <div class="bg-white rounded-2xl shadow-md p-6">
      <form id="loginForm" class="flex flex-col gap-4">

        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">Pilih Nama Anda</label>
          <select id="nama" class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900">
            <option value="">Memuat daftar nama...</option>
          </select>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-500">PIN (4 digit)</label>
          <input type="password" id="pin" maxlength="4" placeholder="****" required
                 class="border rounded-lg p-2 text-sm bg-gray-50 focus:outline-none focus:border-blue-900 text-center tracking-widest">
        </div>

        <button type="submit" id="btnSubmit" class="bg-blue-900 text-white font-semibold py-2 rounded-lg text-sm mt-2 transition hover:bg-blue-800 disabled:opacity-50">
          Masuk
        </button>

      </form>
    </div>
  </div>

  <script>
    // ============ GANTI DUA NILAI INI SESUAI PROJECT SUPABASE ANDA ============
    const SUPABASE_URL = "https://czyccnqkbnjdktihflye.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GMaiiA2Ua2kFSqPjgAtEiA_1vubx6_S";
    // ============================================================================

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. AMBIL DAFTAR NAMA UNTUK DROPDOWN (dari view v_daftar_nama, aman tanpa PIN)
    window.addEventListener('DOMContentLoaded', async () => {
      const selectNama = document.getElementById("nama");
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;

      const { data, error } = await sb.from('v_daftar_nama').select('nama');

      selectNama.innerHTML = "";

      if (!error && data && data.length > 0) {
        data.forEach(row => {
          const option = document.createElement("option");
          option.value = row.nama;
          option.textContent = row.nama;
          selectNama.appendChild(option);
        });
        btnSubmit.disabled = false;
      } else {
        selectNama.innerHTML = '<option value="">Gagal memuat data dari server</option>';
      }
    });

    // 2. PROSES LOGIN (memanggil function login_karyawan di database)
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const btn = document.getElementById("btnSubmit");
      const nama = document.getElementById("nama").value;
      const pin = document.getElementById("pin").value;

      if (!nama) {
        alert("Silakan pilih nama terlebih dahulu.");
        return;
      }

      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      const { data, error } = await sb.rpc('login_karyawan', {
        input_nama: nama,
        input_pin: pin
      });

      if (!error && data && data.length > 0) {
        localStorage.setItem("session_absen", JSON.stringify({
          nama: data[0].nama,
          jabatan: data[0].jabatan
        }));
        window.location.href = "dashboard.html";
      } else {
        alert("Login gagal: Nama atau PIN salah");
        btn.innerText = "Masuk";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
